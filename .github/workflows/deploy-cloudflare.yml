name: Deploy to Cloudflare Pages

on:
  push:
    branches: [claude/gifted-clarke-mu6i09]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# A commit from the admin panel and a commit pushed here can land close
# together; let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  # Not a secret: it's the account-scoped prefix Cloudflare already shows
  # in dashboard URLs. The token itself (which IS the credential) stays a
  # repository secret. A token scoped to Pages:Edit can't call GET
  # /accounts to resolve this on its own, so it's pinned here instead.
  CLOUDFLARE_ACCOUNT_ID: "75081f68f7c968fb145f7383ef446813"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First run on a given project name creates it; later runs no-op
      # against the existing project, so this is safe to repeat.
      - name: Create the Pages project if it doesn't exist yet
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create gs9 --production-branch=${{ github.ref_name }}

      # No build step: the site is static HTML/CSS/JS served from the repo
      # root, same as the GitHub Pages workflow.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gs9 --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the live URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
